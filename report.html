<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Report a Problem - Smart Community</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        #map {
            width: 100%;
            height: 350px;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
        }

        #locationMessage {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <header>

        <h1>Smart Community</h1>

        <p>
            Report a Community Problem
        </p>

    </header>


    <main class="form-container">

        <form id="reportForm">

            <h2>Submit a Report</h2>


            <!-- Problem Title -->

            <label for="title">
                Problem Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="e.g. Broken street light"
                required
            >


            <!-- Description -->

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                rows="5"
                placeholder="Describe the problem..."
                required
            ></textarea>


            <!-- Category -->

            <label for="category">
                Category
            </label>

            <select
                id="category"
                required
            >

                <option value="">
                    -- Select Category --
                </option>

                <option value="Roads">
                    Roads
                </option>

                <option value="Street Lighting">
                    Street Lighting
                </option>

                <option value="Waste Management">
                    Waste Management
                </option>

                <option value="Water">
                    Water
                </option>

                <option value="Drainage">
                    Drainage
                </option>

                <option value="Security">
                    Security
                </option>

                <option value="Environment">
                    Environment
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- Location -->

            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="e.g. Main Street"
                required
            >
            <!-- County -->

<label for="county">
    County
</label>

<select
    id="county"
    required
>
    <option value="">
        -- Select County --
    </option>

    <option value="Baringo">Baringo</option>
    <option value="Bomet">Bomet</option>
    <option value="Bungoma">Bungoma</option>
    <option value="Busia">Busia</option>
    <option value="Elgeyo-Marakwet">Elgeyo-Marakwet</option>
    <option value="Embu">Embu</option>
    <option value="Garissa">Garissa</option>
    <option value="Homa Bay">Homa Bay</option>
    <option value="Isiolo">Isiolo</option>
    <option value="Kajiado">Kajiado</option>
    <option value="Kakamega">Kakamega</option>
    <option value="Kericho">Kericho</option>
    <option value="Kiambu">Kiambu</option>
    <option value="Kilifi">Kilifi</option>
    <option value="Kirinyaga">Kirinyaga</option>
    <option value="Kisii">Kisii</option>
    <option value="Kisumu">Kisumu</option>
    <option value="Kitui">Kitui</option>
    <option value="Kwale">Kwale</option>
    <option value="Laikipia">Laikipia</option>
    <option value="Lamu">Lamu</option>
    <option value="Machakos">Machakos</option>
    <option value="Makueni">Makueni</option>
    <option value="Mandera">Mandera</option>
    <option value="Marsabit">Marsabit</option>
    <option value="Meru">Meru</option>
    <option value="Migori">Migori</option>
    <option value="Mombasa">Mombasa</option>
    <option value="Murang'a">Murang'a</option>
    <option value="Nairobi">Nairobi</option>
    <option value="Nakuru">Nakuru</option>
    <option value="Nandi">Nandi</option>
    <option value="Narok">Narok</option>
    <option value="Nyamira">Nyamira</option>
    <option value="Nyandarua">Nyandarua</option>
    <option value="Nyeri">Nyeri</option>
    <option value="Samburu">Samburu</option>
    <option value="Siaya">Siaya</option>
    <option value="Taita-Taveta">Taita-Taveta</option>
    <option value="Tana River">Tana River</option>
    <option value="Tharaka-Nithi">Tharaka-Nithi</option>
    <option value="Trans Nzoia">Trans Nzoia</option>
    <option value="Turkana">Turkana</option>
    <option value="Uasin Gishu">Uasin Gishu</option>
    <option value="Vihiga">Vihiga</option>
    <option value="Wajir">Wajir</option>
    <option value="West Pokot">West Pokot</option>
</select>


            <!-- Map -->

            <label>
                Select Problem Location on Map
            </label>

            <div id="map"></div>


            <!-- Current Location -->

            <button
                type="button"
                id="locationBtn"
                class="btn secondary"
                style="margin-top: 15px;"
            >
                📍 Use My Current Location
            </button>

            <p id="locationMessage"></p>


            <!-- Latitude -->

            <label for="latitude">
                Latitude
            </label>

            <input
                type="number"
                id="latitude"
                step="any"
                placeholder="Select location on map"
                readonly
            >


            <!-- Longitude -->

            <label for="longitude">
                Longitude
            </label>

            <input
                type="number"
                id="longitude"
                step="any"
                placeholder="Select location on map"
                readonly
            >


            <!-- Photo -->

            <label for="reportImage">
                Upload Photo (optional)
            </label>

            <input
                type="file"
                id="reportImage"
                accept="image/*"
            >


            <!-- Submit -->

            <button
                type="submit"
                class="btn"
            >
                Submit Report
            </button>


            <!-- Message -->

            <p id="reportMessage"></p>


            <!-- Back -->

            <p class="form-link">

                <a href="dashboard.html">
                    ← Back to Dashboard
                </a>

            </p>

        </form>

    </main>


    <footer>

        <p>
            &copy; 2026 Smart Community Problem Reporting System
        </p>

    </footer>


    <!-- Supabase -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Leaflet JavaScript -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- Supabase Connection -->

    <script src="js/supabase.js"></script>


    <!-- Report Logic -->

    <script src="js/report.js"></script>

</body>

</html>
