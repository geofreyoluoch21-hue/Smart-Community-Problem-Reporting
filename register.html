<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Smart Community</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Smart Community</h1>
        <p>Create Your Account</p>
    </header>


    <main class="form-container">

        <form id="registerForm">

            <h2>Register</h2>


            <!-- Full Name -->
            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >


            <!-- Phone -->
            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="e.g. 0712345678"
                required
            >


            <!-- Email -->
            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- Password -->
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
                minlength="6"
            >

            <label class="password-toggle">
                <input
                    type="checkbox"
                    id="showPassword"
                >
                Show password
            </label>


            <!-- Confirm Password -->
            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
                minlength="6"
            >

            <label class="password-toggle">
                <input
                    type="checkbox"
                    id="showConfirmPassword"
                >
                Show confirm password
            </label>


            <!-- Password Match Message -->
            <p id="passwordMatchMessage"></p>


            <!-- Submit -->
            <button
                type="submit"
                class="btn"
            >
                Create Account
            </button>


            <!-- Registration Message -->
            <p id="registerMessage"></p>


            <!-- Login Link -->
            <p class="form-link">
                Already have an account?
                <a href="login.html">
                    Login here
                </a>
            </p>

        </form>

    </main>


    <footer>
        <p>
            &copy; 2026 Smart Community Problem Reporting System
        </p>
    </footer>


    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase connection -->
    <script src="js/supabase.js"></script>


    <!-- Authentication logic -->
    <script src="js/auth.js"></script>


    <!-- Password visibility and matching -->
    <script>
        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const showPassword =
            document.getElementById("showPassword");

        const showConfirmPassword =
            document.getElementById("showConfirmPassword");

        const passwordMatchMessage =
            document.getElementById("passwordMatchMessage");


        // Show / hide password
        showPassword.addEventListener("change", function () {

            passwordInput.type =
                this.checked ? "text" : "password";

        });


        // Show / hide confirm password
        showConfirmPassword.addEventListener("change", function () {

            confirmPasswordInput.type =
                this.checked ? "text" : "password";

        });


        // Check passwords while typing
        function checkPasswords() {

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            if (!confirmPassword) {

                passwordMatchMessage.textContent = "";

                return;
            }


            if (password === confirmPassword) {

                passwordMatchMessage.textContent =
                    "Passwords match.";

            } else {

                passwordMatchMessage.textContent =
                    "Passwords do not match.";
            }
        }


        passwordInput.addEventListener(
            "input",
            checkPasswords
        );

        confirmPasswordInput.addEventListener(
            "input",
            checkPasswords
        );
    </script>

</body>
</html>
