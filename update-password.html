<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password - Smart Community</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Smart Community</h1>
        <p>Set a New Password</p>
    </header>


    <main class="form-container">

        <form id="updatePasswordForm">

            <h2>Set New Password</h2>

            <p>
                Enter and confirm your new password below.
            </p>


            <!-- New Password -->
            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="6"
                required
            >


            <!-- Confirm Password -->
            <label for="confirmNewPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmNewPassword"
                placeholder="Confirm new password"
                minlength="6"
                required
            >


            <!-- Show Password -->
            <label class="password-toggle">
                <input
                    type="checkbox"
                    id="showNewPassword"
                >
                Show password
            </label>


            <!-- Password Match -->
            <p id="updatePasswordMatchMessage"></p>


            <!-- Update Password -->
            <button
                type="submit"
                class="btn"
            >
                Update Password
            </button>


            <!-- Message -->
            <p id="updatePasswordMessage"></p>


            <!-- Login -->
            <p class="form-link">
                Remember your password?
                <a href="login.html">
                    Back to Login
                </a>
            </p>

        </form>

    </main>


    <footer>
        <p>
            &copy; 2026 Smart Community Problem Reporting System
        </p>
    </footer>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase connection -->
    <script src="js/supabase.js"></script>


    <script>

        const updatePasswordForm =
            document.getElementById("updatePasswordForm");

        const newPassword =
            document.getElementById("newPassword");

        const confirmNewPassword =
            document.getElementById("confirmNewPassword");

        const showNewPassword =
            document.getElementById("showNewPassword");

        const matchMessage =
            document.getElementById(
                "updatePasswordMatchMessage"
            );

        const updateMessage =
            document.getElementById(
                "updatePasswordMessage"
            );


        // Show / hide passwords
        showNewPassword.addEventListener(
            "change",
            function () {

                const type =
                    this.checked
                        ? "text"
                        : "password";

                newPassword.type = type;
                confirmNewPassword.type = type;
            }
        );


        // Check passwords while typing
        function checkPasswords() {

            if (!confirmNewPassword.value) {

                matchMessage.textContent = "";

                return;
            }


            if (
                newPassword.value ===
                confirmNewPassword.value
            ) {

                matchMessage.textContent =
                    "Passwords match.";

            } else {

                matchMessage.textContent =
                    "Passwords do not match.";
            }
        }


        newPassword.addEventListener(
            "input",
            checkPasswords
        );

        confirmNewPassword.addEventListener(
            "input",
            checkPasswords
        );


        // Update password
        updatePasswordForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const password =
                    newPassword.value;

                const confirmPassword =
                    confirmNewPassword.value;


                if (password !== confirmPassword) {

                    updateMessage.textContent =
                        "Passwords do not match.";

                    return;
                }


                if (password.length < 6) {

                    updateMessage.textContent =
                        "Password must be at least 6 characters.";

                    return;
                }


                updateMessage.textContent =
                    "Updating password...";


                try {

                    const { error } =
                        await supabaseClient.auth
                            .updateUser({
                                password: password
                            });


                    if (error) {
                        throw error;
                    }


                    updateMessage.textContent =
                        "Password updated successfully! Redirecting to login...";


                    updatePasswordForm.reset();


                    setTimeout(function () {

                        window.location.href =
                            "login.html";

                    }, 2000);


                } catch (error) {

                    console.error(
                        "Password update error:",
                        error
                    );


                    updateMessage.textContent =
                        error.message;
                }

            }
        );

    </script>

</body>
</html>
