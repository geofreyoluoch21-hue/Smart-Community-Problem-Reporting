<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Reports - Smart Community</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

    .reports-container {

        max-width: 1000px;

        margin: 40px auto;

        width: 90%;
    }


    .page-intro {

        background: white;

        padding: 30px;

        border-radius: 15px;

        box-shadow:
            0 5px 20px
            rgba(0, 0, 0, 0.08);

        text-align: center;

        margin-bottom: 30px;
    }


    .page-intro h2 {

        margin-bottom: 10px;

        color: #0f766e;
    }


    .page-intro p {

        color: #4b5563;

        line-height: 1.6;
    }


    .report-card {

        background: white;

        padding: 30px;

        border-radius: 15px;

        box-shadow:
            0 5px 20px
            rgba(0, 0, 0, 0.08);

        margin-bottom: 25px;
    }


    .report-card h2 {

        color: #111827;

        margin-bottom: 15px;
    }


    .report-card p {

        margin-bottom: 10px;

        line-height: 1.6;
    }


    .report-header {

        display: flex;

        justify-content: space-between;

        align-items: flex-start;

        gap: 20px;

        margin-bottom: 15px;
    }


    .status-badge {

        display: inline-block;

        padding: 8px 14px;

        border-radius: 20px;

        font-size: 13px;

        font-weight: bold;

        white-space: nowrap;
    }


    .status-submitted {

        background: #dbeafe;

        color: #1d4ed8;
    }


    .status-review {

        background: #fef3c7;

        color: #92400e;
    }


    .status-progress {

        background: #ede9fe;

        color: #6d28d9;
    }


    .status-resolved {

        background: #dcfce7;

        color: #166534;
    }


    .status-rejected {

        background: #fee2e2;

        color: #991b1b;
    }


    .report-photo {

        width: 100%;

        max-width: 550px;

        max-height: 400px;

        object-fit: cover;

        border-radius: 12px;

        margin-top: 15px;

        border:
            1px solid #e5e7eb;
    }


    .report-details {

        background: #f9fafb;

        padding: 18px;

        border-radius: 10px;

        margin-top: 15px;
    }


    .report-details p:last-child {

        margin-bottom: 0;
    }


    .coordinates {

        font-size: 14px;

        color: #6b7280;
    }


    .empty-state {

        background: white;

        padding: 50px 30px;

        border-radius: 15px;

        box-shadow:
            0 5px 20px
            rgba(0, 0, 0, 0.08);

        text-align: center;
    }


    .empty-state h2 {

        margin-bottom: 12px;

        color: #374151;
    }


    .empty-state p {

        color: #6b7280;

        margin-bottom: 20px;
    }


    .report-link-button {

        display: inline-block;

        background: #0f766e;

        color: white;

        padding: 12px 20px;

        border-radius: 8px;

        text-decoration: none;

        font-weight: bold;
    }


    .report-link-button:hover {

        background: #115e59;
    }


    .loading-message {

        background: white;

        padding: 30px;

        border-radius: 15px;

        text-align: center;

        box-shadow:
            0 5px 20px
            rgba(0, 0, 0, 0.08);
    }


    @media (max-width: 700px) {

        .report-header {

            flex-direction: column;

            gap: 10px;
        }


        .report-card {

            padding: 20px;
        }


        .page-intro {

            padding: 25px 20px;
        }

    }

</style>
```

</head>

<body>

```
<!-- HEADER -->

<header>

    <h1>
        Smart Community
    </h1>

    <p>
        My Submitted Reports
    </p>

</header>


<!-- MAIN -->

<main class="reports-container">


    <!-- INTRO -->

    <div class="page-intro">

        <h2>
            📋 My Reports
        </h2>

        <p>
            View the problems you have reported
            and track their progress.
        </p>

    </div>


    <!-- REPORTS -->

    <div id="reportsContainer">

        <div class="loading-message">

            <p>
                Loading your reports...
            </p>

        </div>

    </div>


    <!-- BACK -->

    <p
        class="form-link"
        style="text-align:center; margin-top:25px;"
    >

        <a href="dashboard.html">
            ← Back to Dashboard
        </a>

    </p>


</main>


<!-- FOOTER -->

<footer>

    <p>
        &copy; 2026 Smart Community Problem Reporting System
    </p>

</footer>


<!-- SUPABASE -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- SUPABASE CONNECTION -->

<script src="js/supabase.js"></script>


<!-- REPORTS LOGIC -->

<script src="js/reports.js"></script>
```

</body>

</html>
