<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Smart Community</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Smart Community</h1>
        <p>Reset Your Password</p>
    </header>


    <main class="form-container">

        <form id="forgotPasswordForm">

            <h2>Forgot Password?</h2>

            <p>
                Enter the email address associated with your account.
                We will send you a password reset link.
            </p>


            <!-- Email -->
            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- Submit -->
            <button
                type="submit"
                class="btn"
            >
                Send Reset Link
            </button>


            <!-- Message -->
            <p id="forgotPasswordMessage"></p>


            <!-- Back to Login -->
            <p class="form-link">
                Remember your password?
                <a href="login.html">
                    Back to Login
                </a>
            </p>

        </form>

    </main>


    <footer>
        <p>
            &copy; 2026 Smart Community Problem Reporting System
        </p>
    </footer>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase connection -->
    <script src="js/supabase.js"></script>


    <script>

        const forgotPasswordForm =
            document.getElementById("forgotPasswordForm");

        const forgotPasswordMessage =
            document.getElementById("forgotPasswordMessage");


        forgotPasswordForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document.getElementById("email")
                        .value
                        .trim();


                forgotPasswordMessage.textContent =
                    "Sending reset link...";


                try {

                    const { error } =
                        await supabaseClient.auth
                            .resetPasswordForEmail(
                                email,
                                {
                                    redirectTo:
                                        "https://geofreyoluoch21-hue.github.io/Smart-Community-Problem-Reporting/update-password.html"
                                }
                            );


                    if (error) {
                        throw error;
                    }


                    forgotPasswordMessage.textContent =
                        "Password reset link sent! Please check your email.";


                    forgotPasswordForm.reset();


                } catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );


                    forgotPasswordMessage.textContent =
                        error.message;
                }

            }
        );

    </script>

</body>
</html>
